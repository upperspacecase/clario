# Fly.io config for the voice-agent WS/HTTP server.
# Region tracks Twilio, not the caller: every 20ms audio frame goes
# Twilio edge -> here -> Gemini and back, while the caller's own leg is
# ordinary PSTN. The Twilio account is US (us1, Ashburn), so iad keeps that
# round trip short. Sydney added most of a planet to it.
# min 1 machine to avoid cold starts during a call.

app = "voice-agent-ws"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.server"

[env]
  LIVE_WS_PORT = "8080"
  LIVE_MODEL = "gemini-2.5-flash-native-audio-preview-12-2025"
  REPORT_MODEL = "gemini-3-flash-preview"
  LIVE_VOICE = "Aoede"
  LIVE_AGENT_NAME = "Sam"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 2

[[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
