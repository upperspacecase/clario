# Fly.io config for the voice-agent WS/HTTP server.
# Runs in syd (Sydney) for low-latency audio to AU users; min 1 machine to
# avoid cold starts during a call.

app = "voice-agent-ws"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.server"

[env]
  LIVE_WS_PORT = "8080"
  LIVE_MODEL = "gemini-3.1-flash-live-preview"
  REPORT_MODEL = "gemini-3-flash-preview"
  LIVE_VOICE = "Aoede"
  LIVE_AGENT_NAME = "Annie"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 2

[[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
