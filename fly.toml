# Fly.io config for the Clario WS/HTTP server.
# Runs on an isolated machine, terminates TLS at the edge, forwards to :8080.
# Auto-stops when idle to stay within the free allowance.

app = "clario-ws"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.server"

[env]
  LIVE_WS_PORT = "8080"
  LIVE_MODEL = "gemini-3.1-flash-live-preview"
  REPORT_MODEL = "gemini-3-flash-preview"
  LIVE_VOICE = "Aoede"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
